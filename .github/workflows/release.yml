name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tray deps (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libappindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross for aarch64 linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build release
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash
      - name: Package Windows EXE (Inno Setup)
        if: matrix.os == 'windows-latest'
        run: |
          iscc packaging/inno/RClash.iss
          ls dist/
        shell: bash
      - name: Package Linux DEB/RPM/AppImage
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked || true
          cargo deb --target ${{ matrix.target }} --no-build || echo "cargo deb skip"
          cargo generate-rpm --target ${{ matrix.target }} || echo "cargo rpm skip"
          bash packaging/appimage/build.sh || echo "appimage skip"
          ls -R dist/ || true
        shell: bash
      - name: Package macOS DMG
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install create-dmg || true
          bash packaging/dmg/build.sh ${{ matrix.target }} || echo "dmg skip"
          ls -R dist/ || true
        shell: bash
      - name: Sign Windows (self-signed gated)
        if: matrix.os == 'windows-latest'
        run: |
          set -e
          if [ -n "${{ secrets.WIN_PFX_B64 }}" ]; then
            echo "${{ secrets.WIN_PFX_B64 }}" | base64 -d > /tmp/cert.pfx
            echo "sign with provided PFX"
            signtool sign //f /tmp/cert.pfx //p "${{ secrets.WIN_PFX_PASSWORD }}" //fd SHA256 //tr http://timestamp.digicert.com //td SHA256 target/${{ matrix.target }}/release/rclash.exe || true
            if ls dist/*.exe 1>/dev/null 2>&1; then
              signtool sign //f /tmp/cert.pfx //p "${{ secrets.WIN_PFX_PASSWORD }}" //fd SHA256 //tr http://timestamp.digicert.com //td SHA256 dist/*.exe || true
            fi
            rm -f /tmp/cert.pfx
          else
            echo "no WIN_PFX_B64 — generate ephemeral self-signed cert"
            powershell -Command '
              $cert = New-SelfSignedCertificate -Type CodeSigning -Subject "CN=RClash Self-Signed" -KeyExportPolicy Exportable -KeySpec Signature -KeyLength 2048 -KeyAlgorithm RSA -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(1) -CertStoreLocation Cert:\CurrentUser\My
              $pwd = ConvertTo-SecureString -String "rclash" -Force -AsPlainText
              Export-PfxCertificate -Cert $cert -FilePath /tmp/self.pfx -Password $pwd | Out-Null
              $cert | Remove-Item
            ' || echo "self-signed gen failed"
            if [ -f /tmp/self.pfx ]; then
              signtool sign //f /tmp/self.pfx //p rclash //fd SHA256 target/${{ matrix.target }}/release/rclash.exe || echo "self-sign binary failed (expected unsigned fallback)"
              if ls dist/*.exe 1>/dev/null 2>&1; then
                signtool sign //f /tmp/self.pfx //p rclash //fd SHA256 dist/*.exe || true
              fi
              rm -f /tmp/self.pfx
            else
              echo "self-signed PFX not created — leave unsigned"
            fi
          fi
        shell: bash
      - name: Sign macOS (ad-hoc)
        if: startsWith(matrix.os, 'macos')
        run: |
          set -e
          if [ -n "${{ secrets.APPLE_CERT_B64 }}" ]; then
            echo "${{ secrets.APPLE_CERT_B64 }}" | base64 -d > /tmp/apple.p12
            security create-keychain -p rclash /tmp/rclash.keychain || true
            security import /tmp/apple.p12 -k /tmp/rclash.keychain -P "${{ secrets.APPLE_CERT_PASSWORD }}" -T /usr/bin/codesign || true
            security unlock-keychain -p rclash /tmp/rclash.keychain || true
            codesign --force --deep --sign "Developer ID Application" target/${{ matrix.target }}/release/rclash || true
            if [ -d dist/RClash.app ]; then
              codesign --force --deep --sign "Developer ID Application" dist/RClash.app || true
            fi
            rm -f /tmp/apple.p12
          else
            echo "no APPLE_CERT_B64 — ad-hoc sign"
            codesign --force --deep --sign - target/${{ matrix.target }}/release/rclash || true
            if [ -d dist/RClash.app ]; then
              codesign --force --deep --sign - dist/RClash.app || true
            fi
          fi
          codesign --verify --verbose target/${{ matrix.target }}/release/rclash || true
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: rclash-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/rclash*
            dist/**/*
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
