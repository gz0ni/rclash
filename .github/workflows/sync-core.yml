name: Sync core nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download core nightly from mihomo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p core
          tried=""
          for repo in "RClash/mihomo" "gz0ni/mihomo"; do
            echo "try $repo"
            if gh release view --repo "$repo" "nightly" --json tagName 2>/dev/null; then
              tag="nightly"
            else
              tag=$(gh release list --repo "$repo" --limit 20 --json tagName --jq '.[].tagName' | grep -E '^nightly' | head -n1 || true)
            fi
            if [ -z "$tag" ]; then
              echo "no nightly tag in $repo"
              continue
            fi
            echo "found tag $tag in $repo"
            if gh release download "$tag" --repo "$repo" --dir core --pattern "rclash-core-*" --pattern "manifest.json" --clobber 2>&1; then
              echo "downloaded from $repo $tag"
              tried="$repo $tag"
              break
            fi
            for p in "rclash-core-*" "manifest.json"; do
              gh release download "$tag" --repo "$repo" --dir core --pattern "$p" --clobber || true
            done
            if ls core/rclash-core-* 1>/dev/null 2>&1 && [ -f core/manifest.json ]; then
              tried="$repo $tag"
              break
            fi
          done
          if [ -z "$tried" ]; then
            echo "no core found in any repo, skip"
            exit 0
          fi
          ls -lh core/
          cat core/manifest.json || true

      - name: Check if core exists
        id: check
        run: |
          if [ -f core/manifest.json ] && ls core/rclash-core-* 1>/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish core-nightly
        if: steps.check.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: core-nightly
          name: "core nightly"
          files: |
            core/rclash-core-*
            core/manifest.json
          prerelease: true
          generate_release_notes: false
          body: "Mirrored from mihomo nightly. Auto-sync 04:00 UTC."
