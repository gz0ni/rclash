name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.2) — leave empty to use latest tag on HEAD"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then TAG="v${{ github.event.workflow_run.head_sha }}"; fi
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi
          echo "Resolved tag: $(cat $GITHUB_OUTPUT)"
        shell: bash

      - name: Download artifacts from CI (workflow_run)
        if: github.event_name == 'workflow_run'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: CI
          run_id: ${{ github.event.workflow_run.id }}
          name: rclash-*
          path: artifacts
          merge-multiple: true
          if_no_artifact_found: error

      - name: Download artifacts from CI (tag push)
        if: github.event_name == 'push'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: CI
          branch: main
          commit: ${{ github.sha }}
          name: rclash-*
          path: artifacts
          merge-multiple: true
          search_artifacts: true
          if_no_artifact_found: wait

      - name: Download artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: CI
          branch: main
          commit: ${{ github.sha }}
          name: rclash-*
          path: artifacts
          merge-multiple: true
          search_artifacts: true
          if_no_artifact_found: error

      - name: List artifacts
        run: |
          echo "Tag: ${{ steps.tag.outputs.tag }}"
          ls -R artifacts || true
          find artifacts -type f | head -n 100
        shell: bash

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
