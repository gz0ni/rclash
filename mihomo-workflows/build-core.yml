name: Build core

on:
  push:
    branches: [rclash, Alpha, main, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            triple: linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            triple: linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            triple: windows-amd64
            ext: .exe
          - os: macos-13
            goos: darwin
            goarch: amd64
            triple: darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            triple: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Build rclash-core
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.1.0-rclash}"
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -trimpath -ldflags "-s -w -X github.com/metacubex/mihomo/constant.Version=${VERSION} -X github.com/metacubex/mihomo/constant.MihomoName=RClash -X github.com/metacubex/mihomo/constant.BuildTime=${BUILD_TIME}" -o rclash-core-${{ matrix.triple }}${{ matrix.ext }} .
          ls -lh rclash-core-*
        shell: bash
      - name: Sha256
        run: sha256sum rclash-core-* > sha256.txt; cat sha256.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: rclash-core-${{ matrix.triple }}
          path: |
            rclash-core-*
            sha256.txt

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate manifest.json
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.1.0-rclash}"
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{" > manifest.json
          echo "  \"version\": \"${VERSION}\"," >> manifest.json
          echo "  \"buildTime\": \"${BUILD_TIME}\"," >> manifest.json
          echo "  \"coreSha256\": {" >> manifest.json
          first=1
          for f in artifacts/rclash-core-*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            triple=$(echo "$base" | sed 's/^rclash-core-//;s/\.exe$//')
            sha=$(sha256sum "$f" | awk '{print $1}')
            if [ $first -eq 0 ]; then echo "," >> manifest.json; fi
            printf "    \"%s\": \"%s\"" "$triple" "$sha" >> manifest.json
            first=0
          done
          echo "" >> manifest.json
          echo "  }" >> manifest.json
          echo "}" >> manifest.json
          cat manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: manifest.json
      - name: Release nightly
        if: github.ref == 'refs/heads/rclash' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ github.run_number }}
          name: nightly ${{ github.run_number }}
          files: |
            artifacts/rclash-core-*
            manifest.json
          prerelease: true
          generate_release_notes: true
