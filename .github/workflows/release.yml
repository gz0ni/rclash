name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.2) — leave empty to use latest tag on HEAD"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then TAG="v${{ github.event.workflow_run.head_sha }}"; fi
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi
          echo "Resolved tag: $(cat $GITHUB_OUTPUT)"
        shell: bash

      - name: Download artifacts from CI
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: CI
          run_id: ${{ github.event.workflow_run.id }}
          pattern: rclash-*
          path: artifacts
          merge_multiple: true

      - name: List artifacts
        run: |
          echo "Tag: ${{ steps.tag.outputs.tag }}"
          ls -R artifacts || true
          find artifacts -type f 2>/dev/null | head -n 100 || true
        shell: bash

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
