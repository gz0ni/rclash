name: Sync upstream

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add upstream
        run: |
          git remote add upstream https://github.com/MetaCubeX/mihomo.git || git remote set-url upstream https://github.com/MetaCubeX/mihomo.git
          git fetch upstream
          git fetch origin
      - name: Try merge upstream/Alpha
        id: merge
        run: |
          git checkout rclash || git checkout -b rclash origin/rclash || git checkout -b rclash
          set +e
          git merge --no-edit upstream/Alpha
          EC=$?
          echo "exit_code=$EC" >> $GITHUB_OUTPUT
          if [ $EC -eq 0 ]; then
            echo "merged=true" >> $GITHUB_OUTPUT
            git push origin rclash
          else
            echo "merged=false" >> $GITHUB_OUTPUT
            git merge --abort || true
          fi
          exit 0
      - name: Trigger build on success
        if: steps.merge.outputs.merged == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-core.yml',
              ref: 'rclash'
            });
      - name: Create PR on conflict
        if: steps.merge.outputs.merged == 'false'
        run: |
          BRANCH="sync/upstream-$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          set +e
          git merge --no-edit upstream/Alpha
          git add -A
          git commit -m "chore: sync upstream Alpha $(date +%Y-%m-%d) — manual resolution needed" || true
          git push origin "$BRANCH" || true
          echo "Created branch $BRANCH — open PR manually if push succeeded"
      - uses: peter-evans/create-pull-request@v6
        if: steps.merge.outputs.merged == 'false'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sync/upstream-${{ github.run_id }}
          title: "chore: sync upstream Alpha — $(date +%Y-%m-%d)"
          body: "Auto-merge failed. Resolve conflicts manually. Upstream: MetaCubeX/mihomo Alpha"
          base: rclash
