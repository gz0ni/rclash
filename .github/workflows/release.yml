name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross for aarch64 linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build release
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash
      - name: Package Windows EXE (Inno Setup)
        if: matrix.os == 'windows-latest'
        run: |
          iscc packaging/inno/RClash.iss
          ls dist/
        shell: bash
      - name: Package Linux DEB/RPM/AppImage
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked || true
          cargo deb --target ${{ matrix.target }} --no-build || echo "cargo deb skip"
          cargo generate-rpm --target ${{ matrix.target }} || echo "cargo rpm skip"
          bash packaging/appimage/build.sh || echo "appimage skip"
          ls -R dist/ || true
        shell: bash
      - name: Package macOS DMG
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install create-dmg || true
          bash packaging/dmg/build.sh ${{ matrix.target }} || echo "dmg skip"
          ls -R dist/ || true
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: rclash-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/rclash*
            dist/**/*
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
