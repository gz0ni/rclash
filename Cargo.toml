[package]
name = "rclash"
version = "0.1.0"
edition = "2021"
description = "RClash — desktop proxy client, 100% mihomo compatible"
license = "GPL-3.0"
authors = ["RClash"]
rust-version = "1.95"

[dependencies]
arboard = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
dirs = "5"
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
tui-textarea = "0.7"
tungstenite = "0.30"
reqwest = { version = "0.13", features = ["blocking", "json", "rustls-no-provider"], default-features = false }
log = "0.4"
chrono = "0.4"
rclash-config = { path = "crates/rclash-config" }
rclash-core-manager = { path = "crates/rclash-core-manager" }
rclash-subscription = { path = "crates/rclash-subscription" }
rclash-sys-proxy = { path = "crates/rclash-sys-proxy" }
rclash-tun = { path = "crates/rclash-tun" }
rclash-updater = { path = "crates/rclash-updater" }
rclash-db = { path = "crates/rclash-db" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.deb]
maintainer = "RClash <https://github.com/RClash/rclash>"
copyright = "2026, RClash"
section = "net"
priority = "optional"
depends = "libgtk-3-0, libappindicator3-1"
assets = [
  ["target/x86_64-unknown-linux-gnu/release/rclash", "usr/bin/rclash", "755"],
  ["target/x86_64-unknown-linux-gnu/release/rclash-core", "usr/bin/rclash-core", "755"],
  ["packaging/linux/rclash.desktop", "usr/share/applications/rclash.desktop", "644"],
  ["assets/icons/linux/rclash.png", "usr/share/icons/hicolor/256x256/apps/rclash.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/x86_64-unknown-linux-gnu/release/rclash", dest = "/usr/bin/rclash", mode = "755" },
  { source = "target/x86_64-unknown-linux-gnu/release/rclash-core", dest = "/usr/bin/rclash-core", mode = "755" },
  { source = "packaging/linux/rclash.desktop", dest = "/usr/share/applications/rclash.desktop", mode = "644" },
  { source = "assets/icons/linux/rclash.png", dest = "/usr/share/icons/hicolor/256x256/apps/rclash.png", mode = "644" },
]

[workspace]
members = ["crates/rclash-config", "crates/rclash-core-manager", "crates/rclash-subscription", "crates/rclash-sys-proxy", "crates/rclash-tun", "crates/rclash-tun-helper", "crates/rclash-updater", "crates/rclash-db"]
