name: Sync core subtree

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Subtree pull mihomo Alpha
        id: sync
        run: |
          set -e
          echo "Fetching Alpha..."
          git fetch https://github.com/MetaCubeX/mihomo Alpha --depth=50 || git fetch https://github.com/MetaCubeX/mihomo Alpha
          # Try subtree pull
          if git subtree pull --prefix=core https://github.com/MetaCubeX/mihomo Alpha --squash -m "sync core $(date +%F) Alpha $(git rev-parse --short FETCH_HEAD)"; then
            echo "pulled=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            # Check if there are changes to push
            if git diff --quiet origin/main..HEAD; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git merge --abort || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pulled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - name: Create PR if changed
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="sync/upstream-$(date +%F)"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"
          gh pr create --title "sync core $(date +%F)" --body "Subtree pull MetaCubeX/mihomo Alpha $(date +%F). После мерджа: bump Cargo.toml version + git tag v* вручную." --base main --head "$BRANCH" || echo "PR exists"
          echo "PR created $BRANCH"

      - name: Notify conflict
        if: steps.sync.outputs.conflict == 'true'
        run: |
          echo "Subtree pull conflict - needs manual resolve"
          echo "Run locally: git subtree pull --prefix=core https://github.com/MetaCubeX/mihomo Alpha --squash"
