[package]
name = "rclash-core-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
egui = "0.32"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "process", "sync"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls-webpki-roots"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
